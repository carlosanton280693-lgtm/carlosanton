<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Professional Portfolio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }
    h1 { margin: 0; font-size: 1.25rem; }
    main {
      max-width: 800px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-sizing: border-box;
      word-wrap: break-word;
    }
    .card h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }
    
    /* Mobile Enhancements */
    @media (max-width: 600px) {
      header { padding: 1rem; }
      main { margin: 1rem auto; padding: 0 0.5rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>HR Portfolio</h1>
  </header>

  <main>
    <div id="public-view">
      <div class="card">
        <h2 id="view-title">HR Operations & Talent Development</h2>
        <p><strong>Capabilities:</strong> <span id="view-capabilities">Loading from Gist...</span></p>
        <p><strong>Tools & Proficiencies:</strong> <span id="view-tools">Loading from Gist...</span></p>
      </div>
    </div>
  </main>

  <script>
    // Configuration: Linked directly to your GitHub Gist raw URL
    const GIST_URL = 'https://gist.githubusercontent.com/carlosanton280693-lgtm/a071f7a1b5e57d2326c94c0a6d71b01a/raw/7f6d761092edb4afa8fb5d987bfa4a8b9cb192ac/gistfile1.txt';

    async function fetchGistData() {
      try {
        const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
        const data = await response.json();

        document.getElementById('view-capabilities').innerText = data.capabilities || '';
        document.getElementById('view-tools').innerText = data.tools || '';
      } catch (error) {
        console.error('Error fetching Gist data:', error);
        document.getElementById('view-capabilities').innerText = 'Failed to load data.';
      }
    }

    fetchGistData();
  </script>
</body>
</html>
